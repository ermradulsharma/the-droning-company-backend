      summary: 'Login Api.'
      description: "If everything is okay, you'll get a `200` OK response with data.\n\nOtherwise, the request will fail with a `401` error, and a response invalid credentials"
      parameters:
        -
          in: header
          name: Content-Type
          description: ''
          example: application/json
          schema:
            type: string
        -
          in: header
          name: Accept
          description: ''
          example: application/json
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  stausCode: 200
                  message: 'User data fetch successfully'
                  data:
                    id: 1
                    first_name: Admin
                    last_name: admin
                    email: admin@admin.com
                    slug: null
                    roles:
                      -
                        id: 1
                        title: Admin
                  access_token: 42|WBh8auQX8LItsHokZAHplNmnu5zYFGsVEEXWaBpj
                properties:
                  stausCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: 'User data fetch successfully'
                  data:
                    type: object
                    example:
                      id: 1
                      first_name: Admin
                      last_name: admin
                      email: admin@admin.com
                      slug: null
                      roles:
                        -
                          id: 1
                          title: Admin
                  access_token:
                    type: string
                    example: 42|WBh8auQX8LItsHokZAHplNmnu5zYFGsVEEXWaBpj
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  stausCode: 401
                  message: 'Invalid Login credentials or data does not exists in our records'
                  data: []
                properties:
                  stausCode:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: 'Invalid Login credentials or data does not exists in our records'
                  data:
                    type: array
                    example: []
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'The email of the user.'
                  example: example@domain.com
                password:
                  type: string
                  description: 'The password of the user.'
                  example: secret
              required:
                - email
                - password
      security: []
